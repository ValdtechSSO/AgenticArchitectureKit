name: Architecture conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build and install the distribution
        run: |
          python3 -m pip install build
          python3 -m build
          python3 -m pip install --no-deps --force-reinstall dist/*.whl
      - name: Validator conformance tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify packaged agent bootstrap resources
        run: |
          aak core > /dev/null
          aak guide bootstrap > /dev/null
          aak guide github-governance > /dev/null
          aak template AGENTS.md > /dev/null
      - name: Validate the kit
        run: aak validate --fail-on-review --task-id architecture-ci
      - name: Guard policy changes against the previous accepted revision
        env:
          BASE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_REVISION" ] && git cat-file -e "$BASE_REVISION:.agentic/policies/architecture/project-policy.json"; then
            aak validate --base-ref "$BASE_REVISION" --fail-on-review --task-id architecture-change
          else
            echo "Base revision predates architecture policy; bootstrap is covered by the strict self-validation step."
          fi
      - name: Retain architecture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: architecture-evidence-${{ github.run_id }}
          path: .agentic/runtime/evidence/
          if-no-files-found: error
